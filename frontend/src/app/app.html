<div class="app-shell">
  <app-header />

  <main class="main-layout">
    <div class="grid-top">
      <app-config-panel (configChange)="onConfigChange($event)" />
      <app-best-choice [modele]="bestModele" [score]="bestScore" [totalModeles]="modeles.length" [config]="config" />
      <app-impact-translator [equiv]="bestEquiv" [maxCo2]="maxCo2" />
    </div>

    <div class="grid-bottom">
      <app-energy-chart [modeles]="modeles" [bestNom]="bestModele?.mdl_nom ?? ''" />
      <app-ranking-table
        [ranked]="ranked"
        [selectedNom]="bestModele?.mdl_nom ?? ''"
        (selectModele)="onSelectModele($event)"
      />
    </div>
  </main>

  <footer class="footer">
  </footer>
</div>
